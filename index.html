<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Club Shorts Reels - MGSML Sky Project</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }
        .glass-overlay {
            background: rgba(5, 11, 20, 0.9);
            backdrop-filter: blur(12px);
        }
        ::-webkit-scrollbar { width: 0px; height: 0px; }
        .shorts-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            padding-top: 110px;
        }
        .short-item {
            height: calc(100vh - 110px);
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            width: 100%;
        }
        .story-ring {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            padding: 2px;
            border-radius: 9999px;
        }
    </style>
</head>
<body>

    <!-- Top Header & Story-Style Horizontal Reel Highlights -->
    <header class="fixed top-0 left-0 right-0 z-40 px-3 py-2.5 glass-overlay border-b border-yellow-500/20 space-y-2">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <a href="index.html" class="w-8 h-8 rounded-full bg-slate-800/90 text-yellow-400 flex items-center justify-center text-xs font-bold shadow-lg active:scale-95 transition">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div class="flex flex-col">
                    <span class="text-xs font-black tracking-wider bg-gradient-to-r from-yellow-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                        SOCIAL CLUB SHORTS
                    </span>
                    <span class="text-[8px] font-bold text-gray-300">Allowed: Up to 3 Mins Shorts Clips</span>
                </div>
            </div>
            <span class="text-[10px] font-black text-yellow-400 bg-yellow-500/10 border border-yellow-500/30 px-2 py-0.5 rounded-full">
                ⚡ Stable Feed
            </span>
        </div>

        <!-- TOP HORIZONTAL HIGHLIGHTS -->
        <div id="topHighlightsBar" class="flex space-x-3 overflow-x-auto py-1 scroll-smooth items-center">
            <div class="text-[9px] font-black text-yellow-400 uppercase tracking-widest whitespace-nowrap flex items-center space-x-1">
                <i class="fa-solid fa-fire text-pink-500 text-xs"></i>
                <span>Highlights</span>
            </div>
        </div>
    </header>

    <!-- Shorts Vertical Scroll Container -->
    <div id="shortsFeedContainer" class="shorts-container">
        <div class="short-item flex flex-col items-center justify-center text-center p-6 text-gray-400">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-yellow-400 mb-2"></i>
            <p class="text-xs font-bold">Loading Shorts Reels...</p>
        </div>
    </div>

    <!-- 19 TOKENS TIP MODAL -->
    <div id="tokenTipModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-[1100] hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-yellow-500/50 w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-xs font-black text-yellow-400 flex items-center space-x-2">
                    <i class="fa-solid fa-coins"></i>
                    <span>SEND 19 TOKENS TIP</span>
                </h3>
                <button onclick="closeTokenTipModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div class="space-y-3">
                <label class="block text-xs font-bold text-gray-300">Select Token Category:</label>
                <select id="selectedTokenCategory" class="w-full bg-slate-950 border border-yellow-500/50 rounded-xl px-3 py-2.5 text-xs text-yellow-400 font-black">
                    <optgroup label="Project Tokens">
                        <option value="MG">MY GROUP (MG)</option>
                        <option value="BLH">BULISH (BLH)</option>
                        <option value="BWD">BOWLD (BWD)</option>
                        <option value="SCS">SUCCESS (SCS)</option>
                        <option value="BRH">BEARISH (BRH)</option>
                        <option value="MLF">MY LIFE (MLF)</option>
                        <option value="HRM">HARAMI (HRM)</option>
                        <option value="MTR">MASTER (MTR)</option>
                        <option value="DOJI">DOJI (DOJI)</option>
                        <option value="BULT">BULLET (BULT)</option>
                        <option value="SGP">SHIPING TOP (SGP)</option>
                        <option value="JKR">JOKER (JKR)</option>
                        <option value="ULG">UNGALPING (ULG)</option>
                        <option value="MGSML">MGSML</option>
                    </optgroup>
                    <optgroup label="Trading & Gaming Tokens">
                        <option value="SKY">SKY</option>
                        <option value="RKT">ROKET (RKT)</option>
                        <option value="GME">GAME (GME)</option>
                        <option value="SSR">SIXSAR (SSR)</option>
                        <option value="TPY">TROPHY (TPY)</option>
                    </optgroup>
                </select>

                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1">Enter Token Quantity:</label>
                    <input type="number" id="tokenTipAmount" value="5" min="1" class="w-full bg-slate-950 border border-cyan-500/50 rounded-xl px-3 py-2 text-xs text-white font-bold">
                </div>

                <button onclick="executeSendTokenTip()" class="w-full py-3 bg-gradient-to-r from-yellow-400 via-amber-500 to-green-400 text-black font-black rounded-xl text-xs shadow-lg active:scale-95 transition">
                    SEND TIP TO CREATOR 🚀
                </button>
            </div>
        </div>
    </div>

    <!-- Script Engine -->
    <script>
        const LIBRARY_ID = "799000";
        let activeShortId = null;

        document.addEventListener("DOMContentLoaded", () => {
            loadShortsAndHighlights();
        });

        function loadShortsAndHighlights() {
            let savedMovies = JSON.parse(localStorage.getItem('mgsml_stream_movies') || '[]');
            
            // STRICT DURATION FILTER: 
            // Allow 1 second up to 180 seconds (3 Minutes). Block anything above 180s (5m, 10m, 1hr movies).
            let shortItems = savedMovies.filter(m => {
                let cat = (m.category || '').toLowerCase();
                let dur = parseInt(m.duration || 0); // duration in seconds
                
                if(cat === 'movie' || cat === 'long') return false;
                if(dur > 180) return false; // Block > 3 minutes (180 seconds)
                
                return cat === 'short' || m.isShort === true || (dur > 0 && dur <= 180);
            });

            // Fallback for testing if no category matched
            if(shortItems.length === 0 && savedMovies.length > 0) {
                shortItems = savedMovies.filter(m => parseInt(m.duration || 0) <= 180);
                if(shortItems.length === 0) shortItems = savedMovies.slice(0, 3);
            }

            let highlightsBar = document.getElementById('topHighlightsBar');
            let feedContainer = document.getElementById('shortsFeedContainer');

            if (shortItems.length === 0) {
                highlightsBar.innerHTML = `<span class="text-[9px] text-gray-400">No clips found</span>`;
                feedContainer.innerHTML = `
                    <div class="short-item flex flex-col items-center justify-center text-center p-6 text-gray-400">
                        <i class="fa-solid fa-triangle-exclamation text-4xl text-yellow-400 mb-3"></i>
                        <p class="text-sm font-bold">No Short Reels Available (Max 3 Mins)!</p>
                        <p class="text-xs text-gray-500 mt-1">Long movies (&gt;3m) are blocked here.</p>
                    </div>`;
                return;
            }

            // Populate Top Highlights
            let sortedByViews = [...shortItems].sort((a, b) => (b.views || 0) - (a.views || 0));
            highlightsBar.innerHTML = `
                <div class="text-[9px] font-black text-yellow-400 uppercase tracking-widest whitespace-nowrap flex items-center space-x-1 pr-1">
                    <i class="fa-solid fa-fire text-pink-500 text-xs"></i>
                    <span>Highlights</span>
                </div>`;
                
            sortedByViews.forEach((item, index) => {
                let thumb = item.thumbnail || '';
                let thumbMarkup = thumb ? `<img src="${thumb}" class="w-full h-full object-cover rounded-full">` : `
                    <div class="w-full h-full bg-slate-900 rounded-full flex flex-col items-center justify-center text-yellow-400 font-black text-[9px]">
                        <i class="fa-solid fa-play"></i>
                    </div>`;
                
                let highlightChip = `
                    <div onclick="scrollToShort(${index})" class="flex flex-col items-center flex-shrink-0 cursor-pointer active:scale-95 transition">
                        <div class="story-ring w-12 h-12 flex items-center justify-center">
                            <div class="w-11 h-11 rounded-full overflow-hidden bg-black border-2 border-black">
                                ${thumbMarkup}
                            </div>
                        </div>
                        <span class="text-[8px] font-bold text-gray-300 mt-1 truncate max-w-[50px]">${item.title}</span>
                    </div>
                `;
                highlightsBar.innerHTML += highlightChip;
            });

            // Populate Vertical Shorts Feed (Stable Embed to stop stuttering/restarting)
            feedContainer.innerHTML = "";
            shortItems.forEach((item, index) => {
                // autoplay=false & muted=false ensures video loads fully and plays smoothly without looping bugs
                let embedUrl = `https://iframe.mediadelivery.net/embed/${LIBRARY_ID}/${item.id}?autoplay=false&loop=false&muted=false`;
                
                let shortDiv = `
                    <div id="short-card-${index}" class="short-item">
                        <iframe src="${embedUrl}" class="w-full h-full absolute inset-0 border-0" loading="lazy" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen="true"></iframe>

                        <!-- Right Side Engagement Panel -->
                        <div class="absolute right-3 bottom-20 z-30 flex flex-col items-center space-y-4">
                            <button onclick="likeShort('${item.id}')" class="flex flex-col items-center text-white active:scale-90 transition">
                                <div class="w-10 h-10 rounded-full bg-black/60 backdrop-blur-md border border-white/20 flex items-center justify-center text-pink-400 text-base shadow-xl">
                                    <i class="fa-solid fa-heart"></i>
                                </div>
                                <span class="text-[9px] font-bold mt-1 text-white">${item.likes || 0}</span>
                            </button>

                            <button onclick="openTokenTipModal('${item.id}')" class="flex flex-col items-center text-white active:scale-90 transition">
                                <div class="w-10 h-10 rounded-full bg-black/60 backdrop-blur-md border border-yellow-500/40 flex items-center justify-center text-yellow-400 text-base shadow-xl">
                                    <i class="fa-solid fa-coins"></i>
                                </div>
                                <span class="text-[9px] font-bold mt-1 text-yellow-400">Tip</span>
                            </button>

                            <button onclick="shareShort('${item.title}')" class="flex flex-col items-center text-white active:scale-90 transition">
                                <div class="w-10 h-10 rounded-full bg-black/60 backdrop-blur-md border border-white/20 flex items-center justify-center text-cyan-400 text-base shadow-xl">
                                    <i class="fa-solid fa-share"></i>
                                </div>
                                <span class="text-[9px] font-bold mt-1 text-white">Share</span>
                            </button>
                        </div>

                        <!-- Bottom Info Overlay -->
                        <div class="absolute bottom-5 left-4 right-16 z-30 space-y-1 pointer-events-none">
                            <span class="px-2 py-0.5 rounded-full bg-yellow-500/20 border border-yellow-500/50 text-yellow-400 text-[9px] font-black uppercase tracking-wider">
                                ⚡ Short Reel (Up to 3m)
                            </span>
                            <h2 class="text-xs font-black text-white drop-shadow-md line-clamp-1">${item.title}</h2>
                            <p class="text-[11px] text-gray-200 drop-shadow-md line-clamp-2">${item.description || 'MGSML Social Club Short.'}</p>
                        </div>
                    </div>
                `;
                feedContainer.innerHTML += shortDiv;
            });
        }

        function scrollToShort(index) {
            let targetCard = document.getElementById(`short-card-${index}`);
            if(targetCard) {
                targetCard.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function likeShort(id) {
            let savedMovies = JSON.parse(localStorage.getItem('mgsml_stream_movies') || '[]');
            let item = savedMovies.find(m => String(m.id) === String(id));
            if(item) {
                item.likes = (item.likes || 0) + 1;
                localStorage.setItem('mgsml_stream_movies', JSON.stringify(savedMovies));
                depositRewardCoins(1, 'SHORT_LIKE');
                loadShortsAndHighlights();
            }
        }

        function shareShort(title) {
            depositRewardCoins(2, 'SHORT_SHARE');
            if(navigator.share) {
                navigator.share({ title: title, url: window.location.href });
            } else {
                alert("🔗 Short link copied to clipboard! +2 Reward Coins added.");
            }
        }

        function depositRewardCoins(amount, type) {
            let currentCoins = parseInt(localStorage.getItem('mgsml_user_coins') || '0');
            currentCoins += amount;
            localStorage.setItem('mgsml_user_coins', currentCoins);

            let history = JSON.parse(localStorage.getItem('mgsml_wallet_history') || '[]');
            history.unshift({ type: type, amount: `+${amount} Coins`, date: new Date().toLocaleString() });
            localStorage.setItem('mgsml_wallet_history', JSON.stringify(history));
        }

        function openTokenTipModal(id) {
            activeShortId = id;
            document.getElementById('tokenTipModal').classList.remove('hidden');
        }
        function closeTokenTipModal() {
            document.getElementById('tokenTipModal').classList.add('hidden');
        }

        function executeSendTokenTip() {
            let tokenType = document.getElementById('selectedTokenCategory').value;
            let qty = parseInt(document.getElementById('tokenTipAmount').value) || 5;

            let currentCoins = parseInt(localStorage.getItem('mgsml_user_coins') || '0');
            currentCoins += qty;
            localStorage.setItem('mgsml_user_coins', currentCoins);

            let history = JSON.parse(localStorage.getItem('mgsml_wallet_history') || '[]');
            history.unshift({ type: 'SHORT_TIP', amount: `+${qty} [${tokenType}]`, date: new Date().toLocaleString() });
            localStorage.setItem('mgsml_wallet_history', JSON.stringify(history));

            alert(`🎉 Success! Sent ${qty} [${tokenType}] tokens tip to the creator!`);
            closeTokenTipModal();
        }
    </script>
</body>
</html>
